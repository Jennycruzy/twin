# The consumer workload.
#
# Twin weights fragility by how heavily an asset is actually used, so the estate needs
# usage data. Rather than inventing query counts, this file declares a workload that is
# genuinely executed against the warehouse: `python -m estate.ingest.workload` runs every
# query below, the stated number of times per day, for the stated number of days, and the
# usage statistics written to DataHub are counts of executions that really happened.
#
# The numbers are therefore honest in a specific and limited sense: they are real counts
# of a synthetic workload. They are not measurements of a real company's BI traffic. What
# they buy is a realistic *skew* — the finance revenue dashboard is refreshed constantly
# and a support query runs twice a week — which is what makes usage-weighted scoring
# produce a meaningful ranking rather than a flat one.
#
#   daily_runs  executions per simulated day
#   users       who runs it. Drives DataHub's distinct-consumer count, which Stage 3 uses
#               separately from raw volume: an asset with one heavy user is a different
#               risk from one with twenty light ones.

days: 7

queries:
  - file: revenue_trend.sql
    dataset: marts.mart_revenue_daily
    consumer: "Finance — Revenue Review"
    daily_runs: 96
    users: [dana.oyelaran@example.com, rowan.beck@example.com, priya.raghavan@example.com]

  - file: authorisation_rate.sql
    dataset: marts.mart_revenue_daily
    consumer: "Finance — Revenue Review"
    daily_runs: 84
    users: [dana.oyelaran@example.com, rowan.beck@example.com]

  - file: reconciliation_gap.sql
    dataset: marts.mart_finance_reconciliation
    consumer: "Finance — Revenue Review"
