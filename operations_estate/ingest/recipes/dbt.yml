source:
  type: dbt
  config:
    manifest_path: /app/operations_estate/dbt/target/manifest.json
    catalog_path: /app/operations_estate/dbt/target/catalog.json
    run_results_paths:
      - /app/operations_estate/dbt/target/run_results.json
    target_platform: postgres
    target_platform_instance: operations
    platform_instance: operations
    include_database_name: true
    infer_dbt_schemas: true
    include_column_lineage: true
    include_compiled_code: true
    entities_enabled:
      test_results: "YES"
      test_definitions: "YES"
      seeds: "NO"
      snapshots: "NO"
    enable_owner_extraction: true
    enable_meta_mapping: true
    strip_user_ids_from_email: false
    meta_mapping:
      team:
        match: ".*"
        operation: "add_tag"
        config: {tag: "team:{{ $match }}"}
      criticality_tier:
        match: ".*"
        operation: "add_tag"
        config: {tag: "tier:{{ $match }}"}

sink:
  type: datahub-rest
  config:
    server: "${DATAHUB_GMS_URL:-http://datahub-gms:8080}"
    token: "${DATAHUB_GMS_TOKEN:-}"
